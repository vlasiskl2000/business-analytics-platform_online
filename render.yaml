services:
  - type: web
    name: business-analytics-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Free plan: uploads and the database are stored in the project's
      # "data" folder and are wiped on every restart/deploy.
      # To keep data, use a paid plan and uncomment BOTH the DATA_DIR variable
      # and the disk below (the paths must match).
      # - key: DATA_DIR
      #   value: /var/data
    # plan: starter
    # disk:
    #   name: app-data
    #   mountPath: /var/data
    #   sizeGB: 1
